services:
  frontend:
    image: ghcr.io/iamceeso/chikaima-frontend:latest
    container_name: chikaima-frontend
    environment:
      NEXT_PUBLIC_APP_NAME: Chikaima
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      CHIKAIMA_APP_ENV: development
      CHIKAIMA_DB_PATH: /app/data/chikaima.db
      CHIKAIMA_MEDIA_ROOT: /app/storage
      CHIKAIMA_JWT_SECRET_KEY: change-me-development-secret # Generate with: openssl rand -hex 32
      CHIKAIMA_JWT_REFRESH_SECRET_KEY: change-me-too-development-secret # Generate with: openssl rand -hex 32
      CHIKAIMA_PROVIDER_SECRET_KEY: replace-with-32-char-secret-key # Generate with: openssl rand -hex 32
      CHIKAIMA_DOCUMENT_UPLOAD_MAX_MEGABYTES: "100"
      CHIKAIMA_AUDIO_UPLOAD_MAX_MEGABYTES: "512"
      CHIKAIMA_VIDEO_UPLOAD_MAX_MEGABYTES: "2048"
      CHIKAIMA_OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHIKAIMA_COLLAB_ROOT: /app/workspaces
      # Where AI team commands (tests, terminal, preview, deploy) run: off | host | docker.
      # docker (recommended) needs the socket mount below; the project containers are siblings
      # of this one, so they mount the folder by its path on the host.
      CHIKAIMA_COLLAB_EXEC: "off"
      CHIKAIMA_COLLAB_HOST_ROOT: ${PWD}/workspaces
      # Previews are published on the host; this container reaches them through the host gateway.
      CHIKAIMA_COLLAB_PREVIEW_HOST: host.docker.internal
    ports:
      - "3000:3000"
      # Only with CHIKAIMA_COLLAB_EXEC=host, where previews run inside this container
      # (in docker mode each project container publishes its own preview port):
      # - "4100-4119:4100-4119"
    restart: unless-stopped
    volumes:
      - chikaima_data:/app/data
      - chikaima_storage:/app/storage
      # Folders AI collaboration teams can edit. Change the left side to a directory on your machine.
      - ./workspaces:/app/workspaces
      # Uncomment with CHIKAIMA_COLLAB_EXEC=docker:
      # - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chikaima_data:
  chikaima_storage:
