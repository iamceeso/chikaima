services:
  frontend:
    image: ghcr.io/iamceeso/chikaima-frontend:latest
    container_name: chikaima-frontend
    environment:
      NEXT_PUBLIC_APP_NAME: Chikaima
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      CHIKAIMA_APP_ENV: development
      CHIKAIMA_DB_PATH: /app/data/chikaima.db
      CHIKAIMA_MEDIA_ROOT: /app/storage
      CHIKAIMA_JWT_SECRET_KEY: change-me-development-secret # Generate with: openssl rand -hex 32
      CHIKAIMA_JWT_REFRESH_SECRET_KEY: change-me-too-development-secret # Generate with: openssl rand -hex 32
      CHIKAIMA_PROVIDER_SECRET_KEY: replace-with-32-char-secret-key # Generate with: openssl rand -hex 32
      CHIKAIMA_DOCUMENT_UPLOAD_MAX_MEGABYTES: "100"
      CHIKAIMA_AUDIO_UPLOAD_MAX_MEGABYTES: "512"
      CHIKAIMA_VIDEO_UPLOAD_MAX_MEGABYTES: "2048"
      CHIKAIMA_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - chikaima_data:/app/data
      - chikaima_storage:/app/storage

volumes:
  chikaima_data:
  chikaima_storage:
